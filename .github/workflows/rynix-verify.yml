name: rynix-verify

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Build rynix-scan release binary
        run: cargo build --release
        working-directory: rynix-core
      - name: Build MCP venv (dev + QA)
        run: uv sync --directory mcp-server --group dev
      - name: QA gateway (ruff, mypy, pylint, pytest, rust)
        run: python scripts/run_qa.py
      - name: final_verify (12 DoD gates)
        run: python scripts/final_verify.py
      - name: Build wheel and smoke import
        run: |
          cd mcp-server
          uv build --wheel
          uv venv /tmp/wheelenv
          uv pip install --python /tmp/wheelenv/bin/python dist/*.whl
          /tmp/wheelenv/bin/python -c "from rynix_mcp.server import health_check; print(health_check())"
          /tmp/wheelenv/bin/python -c "from rynix_mcp.config import _asset_root; print(bool(_asset_root()))"

  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Build rynix-scan release binary
        shell: pwsh
        run: cargo build --release
        working-directory: rynix-core
      - name: Build MCP venv (dev + QA)
        shell: pwsh
        run: uv sync --directory mcp-server --group dev
      - name: QA gateway (ruff, mypy, pylint, pytest, rust)
        shell: pwsh
        run: python scripts/run_qa.py
      - name: final_verify (12 DoD gates)
        shell: pwsh
        run: python scripts/final_verify.py
      - name: Build wheel and smoke import
        shell: pwsh
        run: |
          cd mcp-server
          uv build --wheel
          uv venv "$env:TEMP\wheelenv"
          uv pip install --python "$env:TEMP\wheelenv\Scripts\python.exe" (Get-Item dist\*.whl).FullName
          & "$env:TEMP\wheelenv\Scripts\python.exe" -c "from rynix_mcp.server import health_check; print(health_check())"
          & "$env:TEMP\wheelenv\Scripts\python.exe" -c "from rynix_mcp.config import _asset_root; print(bool(_asset_root()))"
