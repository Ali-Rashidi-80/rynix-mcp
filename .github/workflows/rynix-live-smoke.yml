name: rynix-live-smoke

# Optional live IDOR smoke — set repository secrets:
#   RYNIX_PROBE_BASE_URL — staging/mirror backend URL
#   RYNIX_TARGET_REPO — path to bundled example-law-firm or your fork (defaults to workspace)
#   RYNIX_STEALTH_GATE_SECRET — when profile defines [stealth.gate]
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # weekly Monday 06:00 UTC

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check live smoke secret
        id: smoke
        env:
          RYNIX_PROBE_BASE_URL: ${{ secrets.RYNIX_PROBE_BASE_URL }}
        run: |
          if [ -z "$RYNIX_PROBE_BASE_URL" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SKIP live smoke — add secret RYNIX_PROBE_BASE_URL to enable"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        if: steps.smoke.outputs.enabled == 'true'
        with:
          enable-cache: true
      - name: Build MCP venv
        if: steps.smoke.outputs.enabled == 'true'
        run: uv sync --directory mcp-server --group dev
      - name: Live IDOR smoke
        if: steps.smoke.outputs.enabled == 'true'
        env:
          RYNIX_PROBE_BASE_URL: ${{ secrets.RYNIX_PROBE_BASE_URL }}
          RYNIX_TARGET_REPO: ${{ secrets.RYNIX_TARGET_REPO || github.workspace }}
          RYNIX_STEALTH_GATE_SECRET: ${{ secrets.RYNIX_STEALTH_GATE_SECRET }}
          RYNIX_PROBE_PASSWORD: ${{ secrets.RYNIX_PROBE_PASSWORD }}
          RYNIX_GATE10_LIVE: "1"
        run: python scripts/run_live_smoke_ci.py
