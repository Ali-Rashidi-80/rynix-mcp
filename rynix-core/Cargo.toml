[package]
name = "rynix-core"
version = "0.1.0"
edition = "2021"
description = "Rynix static security analyzer for FastAPI/React repos"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rynix-scan"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
tree-sitter = "0.24"
tree-sitter-python = "0.23"

[dev-dependencies]
tempfile = "3"
